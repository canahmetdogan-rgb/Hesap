<!DOCTYPE html><html lang="tr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>YÜCEL - PROFIL TEKLIF</title><style>:root{--mavi:#012060;--sari:#ffcc00}*{box-sizing:border-box;margin:0;padding:0}body{font-family:Arial;background:#f4f6fa;font-size:12px}.header{display:flex;justify-content:space-between;align-items:center;background:var(--mavi);color:white;padding:8px 10px;position:sticky;top:0;z-index:100}.left{display:flex;gap:8px;align-items:center}.left img{width:42px;height:42px;background:white;border-radius:6px;padding:3px}.right{display:flex;gap:8px;align-items:center}.ayarBtn{background:var(--sari);color:#111;border:2px solid white;padding:8px 12px;border-radius:10px;font-weight:900;cursor:pointer}.doviz{background:#001a4d;border:1px solid var(--sari);border-radius:8px;padding:5px 8px;font-size:10px;color:white;min-width:90px}.wrap{max-width:1200px;margin:0 auto;padding:8px;padding-bottom:220px}.search{width:100%;padding:12px;border:3px solid var(--mavi);border-radius:10px;font-weight:900;font-size:14px}.chips{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}.chip{padding:5px 10px;border-radius:16px;border:2px solid var(--mavi);background:white;font-weight:800;font-size:10px;cursor:pointer}.chip.active{background:var(--sari)}.tableWrap{background:white;border:2px solid var(--mavi);border-radius:10px;overflow:auto;margin-top:8px}table{width:100%;border-collapse:collapse;white-space:nowrap}th{background:var(--mavi);color:white;padding:6px 5px;font-size:10px;position:sticky;top:0}td{padding:5px;border-bottom:1px solid #ddd;font-size:11px}td input{width:65px;padding:4px;border:1px solid var(--mavi);border-radius:6px;font-weight:700;text-align:center}.badge{font-size:8px;padding:2px 5px;border-radius:4px;font-weight:900}.yucel{background:#0a7a2f;color:white}.tosc{background:#7c3aed;color:white}.btn{background:var(--mavi);color:var(--sari);border:none;padding:5px 8px;border-radius:6px;font-weight:900;cursor:pointer}.sepet{position:fixed;bottom:0;left:0;right:0;background:white;border-top:4px solid var(--mavi);max-height:52vh;overflow:auto;padding:8px;z-index:200}.inp{padding:5px;border-radius:6px;border:1.5px solid var(--mavi);font-size:11px}.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;z-index:300;align-items:center;justify-content:center;padding:10px}.modalBox{background:white;border-radius:12px;padding:12px;max-width:500px;width:100%;max-height:92vh;overflow:auto;border:3px solid var(--mavi)}.hata{background:#ffdddd;border:2px solid red;padding:10px;border-radius:8px;margin-top:10px;color:#900;font-weight:900}</style></head><body>
<div class="header"><div class="left"><img id="logoImg" src="https://via.placeholder.com/80?text=LOGO"><div><b id="firmaAdiG">YÜCEL BORU</b><br><small id="firmaAdresG" style="color:#ffcc00;font-size:10px">Aksaray OSB | <span id="listeSay"></span></small></div></div><div class="right"><div class="doviz"><b>DÖVİZ</b><br>USD:<span id="usd">41,20</span><br>EUR:<span id="eur">44,80</span></div><button class="ayarBtn" onclick="openAyar()">⚙️ AYAR</button></div></div>
<div class="wrap"><input id="ara" class="search" placeholder="Ara: 20x30 yaz, 40x60 yaz... TEK SATIRDA GELECEK" oninput="filtre()"><div class="chips" id="chips"></div><div id="hata" class="hata" style="display:none"></div><div class="tableWrap"><table><thead><tr><th>No</th><th>Malzeme Cinsi (Ebat x Kalınlık = Fiyat)</th><th>Liste</th><th>Tip</th><th>Birim TL/mt</th><th>Adet (1=6mt)</th><th>Mt</th><th>İsk %</th><th>Satış</th><th>Tutar</th><th>Genel KDV Dahil</th><th>İşlem</th></tr></thead><tbody id="listeBody"></tbody></table></div></div>
<div class="sepet"><div style="display:flex;gap:5px;flex-wrap:wrap;align-items:center"><b>SEPET (<span id="say">0</span>)</b><input id="musteri" class="inp" placeholder="Müşteri"><input id="mTarih" type="date" class="inp"><input id="genelIsk" type="number" placeholder="Genel İsk%" class="inp" style="width:80px" oninput="renderSepet()"><input id="genelKdv" type="number" value="20" class="inp" style="width:60px" oninput="renderSepet()"><button class="inp" style="background:#ff4444;color:white;border:none" onclick="temizle()">TEMİZLE</button><button class="inp" style="background:#012060;color:#ffcc00;border:none;font-weight:900" onclick="yazdir()">🖨️ TEKLİF - BANKA + KAŞE</button></div><div id="sepetListe"></div><div id="sepetToplam" style="font-weight:900;color:#012060;margin-top:4px"></div></div>
<div class="modal" id="ayarModal"><div class="modalBox"><h3>⚙️ AYARLAR - Sağ Köşe Ayrı</h3><label>Firma Adı</label><input id="aFirma" class="inp" style="width:100%;margin:3px 0" value="YÜCEL BORU - Aksaray"><label>Adres</label><input id="aAdres" class="inp" style="width:100%;margin:3px 0" value="Aksaray OSB, Merkez / AKSARAY"><label>İletişim Tel / Mail</label><input id="aIlet" class="inp" style="width:100%;margin:3px 0" value="0 532 123 45 67 | info@yucelboru.com"><label>Logo Dosya Seç</label><input id="aLogo" type="file" accept="image/*" class="inp" style="width:100%;margin:3px 0" onchange="logoYukle(event)"><label>Banka 1 - Halkbank IBAN</label><input id="aBanka1" class="inp" style="width:100%;margin:3px 0" value="Halkbank Adana Ticari Şube : TR32 0001 2009 6130 0010 2606 18"><label>Banka 2 - İş Bankası IBAN</label><input id="aBanka2" class="inp" style="width:100%;margin:3px 0" value="İş Bankası Adana Ticari Şube : TR71 0006 4000 0016 0150 3596 41"><label>Banka 3 - Akbank IBAN</label><input id="aBanka3" class="inp" style="width:100%;margin:3px 0" value="Akbank Adana Toptancı Hali Şube : TR95 0004 6006 2788 8000 0537 01"><label>V.D. / V.N.</label><input id="aVergi" class="inp" style="width:100%;margin:3px 0" value="V.D.: Yüreğir - V.N.: 419 006 1367"><label>Varsayılan KDV %</label><input id="aKdv" type="number" value="20" class="inp" style="width:100%;margin:3px 0"><label>Varsayılan İskonto %</label><input id="aIsk" type="number" value="0" class="inp" style="width:100%;margin:3px 0"><button class="btn" style="width:100%;background:#ffcc00;color:#111;border:2px solid #012060;padding:10px;border-radius:8px;font-weight:900" onclick="kaydetAyar()">KAYDET</button><button class="btn" style="width:100%;margin-top:5px;background:#ccc;color:#111" onclick="closeAyar()">KAPAT</button></div></div>
<script>
let URUNLER=[],secKal=null,secTip=null,secListe=null,sepet=JSON.parse(localStorage.getItem('yucel_sepet_fix')||'[]');
let ayar=JSON.parse(localStorage.getItem('yucel_ayar_fix')||'null')||{firma:"YÜCEL BORU - Aksaray",adres:"Aksaray OSB, Merkez / AKSARAY",ilet:"0 532 123 45 67 | info@yucelboru.com",logo:"",kdv:20,isk:0,banka1:"Halkbank Adana Ticari Şube : TR32 0001 2009 6130 0010 2606 18",banka2:"İş Bankası Adana Ticari Şube : TR71 0006 4000 0016 0150 3596 41",banka3:"Akbank Adana Toptancı Hali Şube : TR95 0004 6006 2788 8000 0537 01",vergi:"V.D.: Yüreğir - V.N.: 419 006 1367"};
function uygulaAyar(){document.getElementById('firmaAdiG').innerText=ayar.firma;document.getElementById('firmaAdresG').innerText=ayar.adres+" | "+ayar.ilet;if(ayar.logo)document.getElementById('logoImg').src=ayar.logo;document.getElementById('genelKdv').value=ayar.kdv;}
function openAyar(){document.getElementById('aFirma').value=ayar.firma;document.getElementById('aAdres').value=ayar.adres;document.getElementById('aIlet').value=ayar.ilet;document.getElementById('aKdv').value=ayar.kdv;document.getElementById('aIsk').value=ayar.isk;document.getElementById('aBanka1').value=ayar.banka1;document.getElementById('aBanka2').value=ayar.banka2;document.getElementById('aBanka3').value=ayar.banka3;document.getElementById('aVergi').value=ayar.vergi;document.getElementById('ayarModal').style.display='flex';}
function closeAyar(){document.getElementById('ayarModal').style.display='none';}
function logoYukle(e){let f=e.target.files[0];let r=new FileReader();r.onload=function(){ayar.logo=r.result;document.getElementById('logoImg').src=r.result;};r.readAsDataURL(f);}
function kaydetAyar(){ayar.firma=document.getElementById('aFirma').value;ayar.adres=document.getElementById('aAdres').value;ayar.ilet=document.getElementById('aIlet').value;ayar.kdv=parseFloat(document.getElementById('aKdv').value)||20;ayar.isk=parseFloat(document.getElementById('aIsk').value)||0;ayar.banka1=document.getElementById('aBanka1').value;ayar.banka2=document.getElementById('aBanka2').value;ayar.banka3=document.getElementById('aBanka3').value;ayar.vergi=document.getElementById('aVergi').value;localStorage.setItem('yucel_ayar_fix',JSON.stringify(ayar));uygulaAyar();closeAyar();}
async function yukle(){let hataEl=document.getElementById('hata');try{let res=await fetch('urun.json?v='+Date.now());let txt=await res.text();let data;try{data=JSON.parse(txt);}catch(e){if(txt.includes('LISTE ADI')||txt.includes('x')){hataEl.style.display='block';hataEl.innerHTML='⚠️ urun.json düz yazı! Otomatik çeviriyorum... Lütfen doğru JSON yap.';let lines=txt.split('\n').filter(l=>l.includes('x')&&l.includes('TL'));data=lines.map((line,i)=>{let m=line.match(/(\d+x\d+)x([\d,]+)\s*=\s*([\d,]+)/);if(!m)return null;let ebat=m[1];let kal=m[2];let fiyat=m[3];let tip=ebat.split('x')[0]===ebat.split('x')[1]?'KARE PROFIL':'DIKDORTGEN PROFIL';return {id:i+1,ebat:ebat,kalinlik:kal,fiyat:fiyat,tip:tip,detay:'HR PROFIL',tarih:'25.09.2026',liste:'YUCEL',formatli:line.trim()};}).filter(Boolean);}else throw e;}URUNLER=data.map((u,i)=>{u.no=i+1;if(!u.liste)u.liste='YUCEL';return u;});document.getElementById('listeSay').innerText=URUNLER.length+' ürün';filtre();renderSepet();}catch(err){hataEl.style.display='block';hataEl.innerHTML='❌ Liste gelmedi: '+err;URUNLER=[{id:1,no:1,ebat:"20x30",kalinlik:"1,20",fiyat:"60,91",tip:"DIKDORTGEN PROFIL",detay:"HR PROFIL",tarih:"25.09.2026",liste:"YUCEL"},{id:2,no:2,ebat:"40x60",kalinlik:"1,50",fiyat:"135,53",tip:"DIKDORTGEN PROFIL",detay:"HR PROFIL",tarih:"25.09.2026",liste:"TOSCELIK"}];filtre();renderSepet();}}
function filtre(){let q=(document.getElementById('ara').value||'').toUpperCase().trim();let tbody=document.getElementById('listeBody');tbody.innerHTML='';let say=0;URUNLER.forEach((u,i)=>{if(secKal&&u.kalinlik!==secKal)return;if(secTip&&!u.tip.includes(secTip))return;if(secListe&&u.liste!==secListe)return;let arama=`${u.ebat} ${u.ebat}x${u.kalinlik}`.toUpperCase();if(q&&!arama.includes(q))return;if(q===''&&say>=80)return;say++;let birim=parseFloat((u.fiyat+'').replace(',','.'))||0;let tr=document.createElement('tr');tr.innerHTML=`<td>${u.no||i+1}</td><td><b>${u.ebat}x${u.kalinlik}</b> = ${u.fiyat} TL <span class="badge ${u.tip.includes('KARE')?'yucel':'tosc'}">${u.tip.includes('KARE')?'KARE':'DİK'}</span> <small>${u.tarih||''}</small></td><td><span class="badge ${u.liste==='YUCEL'?'yucel':'tosc'}">${u.liste} LİSTE</span></td><td>${u.tip.includes('KARE')?'KARE':'DİK'}</td><td><input type="number" id="bf-${i}" value="${birim.toFixed(2)}" oninput="hesapla(${i})"></td><td><input type="number" id="adet-${i}" value="1" min="1" oninput="hesapla(${i})"></td><td><input type="number" id="mt-${i}" value="6" readonly></td><td><input type="number" id="isk-${i}" value="${ayar.isk}" oninput="hesapla(${i})"></td><td><input type="number" id="satis-${i}" value="${birim.toFixed(2)}" readonly></td><td><b id="ara-${i}">0</b></td><td><b id="genel-${i}" style="color:#012060">0</b></td><td><button class="btn" onclick="ekle(${i})">+ SEPET</button></td>`;tbody.appendChild(tr);});URUNLER.forEach((u,i)=>{if(document.getElementById('adet-'+i))hesapla(i);});renderChips();}
function hesapla(i){let adet=parseFloat(document.getElementById('adet-'+i)?.value)||1;let mt=adet*6;let mtEl=document.getElementById('mt-'+i);if(mtEl)mtEl.value=mt;let bf=parseFloat(document.getElementById('bf-'+i)?.value)||0;let isk=parseFloat(document.getElementById('isk-'+i)?.value)||0;let satis=bf*(1-isk/100);let satisEl=document.getElementById('satis-'+i);if(satisEl)satisEl.value=satis.toFixed(2);let kdv=parseFloat(document.getElementById('genelKdv')?.value)||20;let ara=satis*mt;let genel=ara*(1+kdv/100);let araEl=document.getElementById('ara-'+i);if(araEl)araEl.innerText=ara.toFixed(2)+' TL';let genelEl=document.getElementById('genel-'+i);if(genelEl)genelEl.innerText=genel.toFixed(2)+' TL';}
function renderChips(){let h=`<div class="chip ${!secKal&&!secTip&&!secListe?'active':''}" onclick="secKal=null;secTip=null;secListe=null;filtre()">TÜMÜ (${URUNLER.length})</div><div class="chip ${secListe==='YUCEL'?'active':''}" onclick="secListe='YUCEL';filtre()">YÜCEL LİSTE</div><div class="chip ${secListe==='TOSCELIK'?'active':''}" onclick="secListe='TOSCELIK';filtre()">TOSÇELİK LİSTE</div>`;["1,20","1,50","2,00","3,00"].forEach(k=>{h+=`<div class="chip ${secKal===k?'active':''}" onclick="secKal='${k}';filtre()">${k}</div>`});h+=`<div class="chip" onclick="secTip='KARE';filtre()">KARE</div><div class="chip" onclick="secTip='DIK';filtre()">DİKDÖRTGEN</div>`;document.getElementById('chips').innerHTML=h;}
function ekle(i){let u=URUNLER[i];let adet=parseFloat(document.getElementById('adet-'+i)?.value)||1;let bf=parseFloat(document.getElementById('bf-'+i)?.value)||0;let isk=parseFloat(document.getElementById('isk-'+i)?.value)||0;let satis=bf*(1-isk/100);let mt=adet*6;let ara=satis*mt;let kdv=parseFloat(document.getElementById('genelKdv')?.value)||20;let kdvT=ara*kdv/100;let genel=ara+kdvT;sepet.push({...u,adet,mt,bf,isk,satis,kdv,ara,kdvT,genel});localStorage.setItem('yucel_sepet_fix',JSON.stringify(sepet));renderSepet();}
function renderSepet(){document.getElementById('say').innerText=sepet.length;let genelIsk=parseFloat(document.getElementById('genelIsk')?.value)||0;let genelKdv=parseFloat(document.getElementById('genelKdv')?.value)||20;let toplamAra=0,toplamKdv=0,toplamGenel=0;let html='<table><tr><th>No</th><th>Malzeme</th><th>Liste</th><th>Adet/Mt</th><th>Birim</th><th>İsk</th><th>Satış</th><th>Genel</th><th></th></tr>';sepet.forEach((s,i)=>{let satisEff=s.satis*(1-genelIsk/100);let araEff=satisEff*s.mt;let kdvEff=araEff*genelKdv/100;let genelEff=araEff+kdvEff;toplamAra+=araEff;toplamKdv+=kdvEff;toplamGenel+=genelEff;html+=`<tr><td>${i+1}</td><td><b>${s.ebat}x${s.kalinlik}</b>=${s.fiyat} TL</td><td>${s.liste}</td><td>${s.adet} adet=${s.mt}mt</td><td>${s.bf.toFixed(2)}</td><td>%${s.isk}${genelIsk?'+%'+genelIsk:''}</td><td>${satisEff.toFixed(2)}</td><td><b>${genelEff.toFixed(2)}</b></td><td><button onclick="sil(${i})" style="color:red;border:none;background:none">❌</button></td></tr>`;});html+='</table>';document.getElementById('sepetListe').innerHTML=sepet.length?html:'Sepet boş - 20x30 yaz, 40x60 yaz';document.getElementById('sepetToplam').innerText=`ARA:${toplamAra.toFixed(2)} TL | KDV:${toplamKdv.toFixed(2)} TL | GENEL:${toplamGenel.toFixed(2)} TL`;}
function sil(i){sepet.splice(i,1);localStorage.setItem('yucel_sepet_fix',JSON.stringify(sepet));renderSepet();}
function temizle(){if(confirm('Temizle?')){sepet=[];localStorage.setItem('yucel_sepet_fix','[]');renderSepet();}}
function yazdir(){if(!sepet.length)return alert('Sepet boş');let musteri=document.getElementById('musteri').value||'';let t=document.getElementById('mTarih').value||new Date().toLocaleDateString('tr-TR');let genelIsk=parseFloat(document.getElementById('genelIsk').value)||0;let genelKdv=parseFloat(document.getElementById('genelKdv').value)||20;let toplamAra=0,toplamKdv=0,toplamGenel=0;let rows=sepet.map((s,i)=>{let satisEff=s.satis*(1-genelIsk/100);let araEff=satisEff*s.mt;let kdvEff=araEff*genelKdv/100;let genelEff=araEff+kdvEff;toplamAra+=araEff;toplamKdv+=kdvEff;toplamGenel+=genelEff;return `<tr><td>${i+1}</td><td>${s.ebat}x${s.kalinlik} = ${s.fiyat} TL</td><td>${s.tip}</td><td>${s.liste} LİSTE</td><td>${s.adet} adet (${s.mt} mt)</td><td>${s.bf.toFixed(2)} TL</td><td>%${s.isk} ${genelIsk?'+%'+genelIsk:''}</td><td>${satisEff.toFixed(2)} TL</td><td>${araEff.toFixed(2)} TL</td><td>${genelEff.toFixed(2)} TL</td></tr>`;}).join('');let html=`<!DOCTYPE html><html><head><meta charset="UTF-8"><style>body{font-family:Arial;font-size:11px} .head{display:flex;justify-content:space-between;border-bottom:4px solid #012060;padding-bottom:8px} .logo{width:70px;height:70px;border:1px solid #ccc} table{width:100%;border-collapse:collapse;margin-top:8px} th{background:#012060;color:white;padding:5px;font-size:10px} td{padding:5px;border-bottom:1px solid #ddd} .toplam{background:#012060;color:white;padding:10px;display:flex;justify-content:space-between;font-weight:900} .bank{border:2px solid #111;padding:6px;background:#fffde7;margin-top:8px;font-size:10px} .kaseAlani{display:flex;justify-content:space-between;margin-top:15px;gap:10px} .kase{border:2px dashed #333;width:30%;height:110px;display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center;font-size:10px}</style></head><body><div class="head"><div><img class="logo" src="${ayar.logo||'https://via.placeholder.com/80?text=LOGO'}"><h2>${ayar.firma}</h2><div>${ayar.adres}</div><div>${ayar.ilet}</div><div>${ayar.vergi}</div><div>Tarih:${t} | Müşteri:${musteri}</div></div><div style="text-align:right"><b>DÖVİZ</b><br>USD:${document.getElementById('usd').innerText} TL<br>EUR:${document.getElementById('eur').innerText} TL<br><br>Liste:25.09.2026<br>Kalem:${sepet.length}</div></div><table><tr><th>No</th><th>Malzeme Cinsi</th><th>Tip</th><th>Liste</th><th>Adet/Mt</th><th>Birim</th><th>İsk</th><th>Satış Birim</th><th>Tutar</th><th>Genel</th></tr>${rows}</table><div class="toplam"><span>ARA:${toplamAra.toFixed(2)} | KDV %${genelKdv}:${toplamKdv.toFixed(2)}</span><span>GENEL:${toplamGenel.toFixed(2)} TL</span></div><div class="bank"><b>HESAP NUMARALARIMIZ:</b><br>1-${ayar.banka1}<br>2-${ayar.banka2}<br>3-${ayar.banka3}<br>${ayar.vergi}</div><div class="kaseAlani"><div class="kase"><b>SATIŞ YÖNETİCİSİ</b><br><br>${ayar.firma}<br><br>(KAŞE-İMZA)</div><div class="kase"><b>SATIŞ TEMSİLCİSİ</b><br><br>(KAŞE-İMZA)</div><div class="kase"><b>MÜŞTERİ ONAYI</b><br><br>(KAŞE-İMZA)</div></div><div style="text-align:center;margin-top:12px"><button onclick="window.print()" style="padding:10px 20px;background:#012060;color:white;border:none;border-radius:6px;font-weight:900">🖨️ YAZDIR / PDF</button></div></body></html>`;let w=window.open('','_blank');w.document.write(html);w.document.close();}
document.getElementById('mTarih').valueAsDate=new Date();uygulaAyar();yukle();
</script></body></html>
