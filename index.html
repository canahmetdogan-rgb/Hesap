<!DOCTYPE html><html lang="tr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>YUCEL - LISTE AYRI - HAFIF</title><style>:root{--mavi:#012060;--sari:#ffcc00}*{box-sizing:border-box;margin:0;padding:0}body{font-family:Arial;background:#f5f6fa;font-size:13px}.header{display:flex;justify-content:space-between;align-items:center;background:var(--mavi);color:white;padding:10px 12px;position:sticky;top:0;z-index:100}.left{display:flex;gap:8px;align-items:center}.left img{width:42px;height:42px;background:white;border-radius:8px;padding:4px}.right{display:flex;gap:8px;align-items:center}.ayarBtn{background:var(--sari);color:#111;border:2px solid white;padding:8px 14px;border-radius:10px;font-weight:900;cursor:pointer}.doviz{background:#001a4d;border:1px solid var(--sari);border-radius:8px;padding:6px 10px;font-size:11px;color:white;min-width:100px}.wrap{max-width:1100px;margin:0 auto;padding:10px;padding-bottom:380px}.listeSec{background:white;border:3px solid var(--mavi);border-radius:12px;padding:10px}.listeBtns{display:flex;gap:8px;margin-top:6px;flex-wrap:wrap}.listeBtn{padding:10px 18px;border-radius:20px;border:2px solid var(--mavi);background:white;font-weight:900;cursor:pointer}.listeBtn.active{background:var(--mavi);color:white}.listeBtn.activeTos{background:#7c3aed;color:white;border-color:#7c3aed}.search{width:100%;padding:14px;border:3px solid var(--mavi);border-radius:12px;font-weight:900;font-size:15px;margin-top:10px}.tableWrap{background:white;border:2px solid var(--mavi);border-radius:12px;overflow:auto;margin-top:10px}table{width:100%;border-collapse:collapse}th{background:var(--mavi);color:white;padding:9px 6px;font-size:12px;position:sticky;top:0;text-align:left}td{padding:10px 6px;border-bottom:1px solid #ddd;font-size:13px}.badge{font-size:10px;padding:3px 7px;border-radius:5px;font-weight:900}.yucel{background:#0a7a2f;color:white}.tosc{background:#7c3aed;color:white}.secBtn{background:var(--mavi);color:var(--sari);border:none;padding:9px 16px;border-radius:8px;font-weight:900;cursor:pointer}.altPanel{position:fixed;bottom:0;left:0;right:0;background:white;border-top:5px solid var(--mavi);padding:12px;z-index:200}.seciliUrun{background:#eef3ff;border:2px solid var(--mavi);border-radius:10px;padding:10px;font-weight:900}.kontrols{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin-top:10px;background:#fffbe6;border:2px dashed #999;border-radius:10px;padding:10px}.kontrols label{font-size:10px;font-weight:900;color:var(--mavi)}.kontrols input{width:100%;padding:9px;border-radius:8px;border:2px solid var(--mavi);font-weight:900;font-size:14px}.hesapBar{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;font-weight:900;font-size:12px}.hesapBar span{background:#fff3cd;border:1px dashed #999;padding:5px 8px;border-radius:6px}.listeAtBtn{background:var(--sari);color:#111;border:3px solid var(--mavi);padding:13px 18px;border-radius:10px;font-weight:900;cursor:pointer;width:100%;margin-top:8px;font-size:15px}.sepetListe{max-height:16vh;overflow:auto;margin-top:8px}.inp{padding:7px;border-radius:7px;border:1.5px solid var(--mavi);font-size:12px}.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;z-index:300;align-items:center;justify-content:center;padding:10px}.modalBox{background:white;border-radius:12px;padding:12px;max-width:520px;width:100%;max-height:92vh;overflow:auto;border:3px solid var(--mavi)}</style></head><body>
<div class="header"><div class="left"><img id="logoImg" src="https://via.placeholder.com/80?text=LOGO"><div><b id="firmaAdiG">YUCEL BORU - Aksaray</b><br><small id="firmaAdresG" style="color:#ffcc00;font-size:10px">Aksaray OSB</small><br><small id="listeSayG" style="color:#fff;font-size:9px"></small></div></div><div class="right"><div class="doviz"><b>DOVIZ</b><br>USD:<span id="usd">41,20</span><br>EUR:<span id="eur">44,80</span></div><button class="ayarBtn" onclick="openAyar()">AYAR</button></div></div>
<div class="wrap"><div class="listeSec"><b>ONCE LISTE SEC:</b><div class="listeBtns"><button id="btnYucel" class="listeBtn active" onclick="secListeTip('YUCEL')">YUCEL LISTE</button><button id="btnTos" class="listeBtn" onclick="secListeTip('TOSCELIK')">TOSCELIK LISTE</button><button id="btnTumu" class="listeBtn" onclick="secListeTip(null)">TUM LISTELER</button></div><small style="color:#666">Secili: <b id="seciliListeTxt">YUCEL LISTE</b> | Sonra 20x30 veya 40x60 yaz</small></div><input id="ara" class="search" placeholder="URUN ARA: 20x30 yaz, 40x60 yaz..." oninput="filtre()"><div class="tableWrap"><table><thead><tr><th>No</th><th>Malzeme Cinsi (Ebat x Kalinlik = Fiyat)</th><th>Liste</th><th>Sec</th></tr></thead><tbody id="listeBody"></tbody></table></div></div>
<div class="altPanel"><div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px"><div class="seciliUrun" id="seciliUrunBox">Henuz urun secilmedi - Yukaridan SEC'e bas</div><div style="display:flex;gap:6px;flex-wrap:wrap"><input id="musteri" class="inp" placeholder="Musteri"><input id="mTarih" type="date" class="inp"><input id="genelIsk" type="number" placeholder="Genel Isk%" class="inp" style="width:80px" oninput="renderSepet()"><input id="genelKdv" type="number" value="20" class="inp" style="width:60px" oninput="renderSepet(); hesapAlt();"><button class="inp" style="background:#ff4444;color:white;border:none" onclick="temizle()">TEMIZLE</button><button class="inp" style="background:#012060;color:#ffcc00;border:none;font-weight:900" onclick="yazdir()">TEKLIF</button></div></div><div class="kontrols" id="kontrols" style="display:none"><label>Secili Urun<input type="text" id="altEbat" readonly></label><label>Birim Fiyat TL/mt<input type="number" id="altBf" oninput="hesapAlt()"></label><label>Adet (1 adet=6mt)<input type="number" id="altAdet" value="1" min="1" oninput="hesapAlt()"></label><label>Mt<input type="number" id="altMt" value="6" readonly></label><label>Isk %<input type="number" id="altIsk" value="0" oninput="hesapAlt()"></label><label>Satis<input type="number" id="altSatis" readonly></label><label>KDV %<input type="number" id="altKdv" value="20" oninput="hesapAlt()"></label></div><div class="hesapBar" id="hesapBar" style="display:none"></div><button class="listeAtBtn" id="listeAtBtn" style="display:none" onclick="listeAt()">LISTE AT / SEPETE EKLE</button><div class="sepetListe" id="sepetListe"></div><div id="sepetToplam" style="font-weight:900;color:#012060;margin-top:6px"></div></div>
<div class="modal" id="ayarModal"><div class="modalBox"><h3>AYARLAR</h3><label>Firma</label><input id="aFirma" class="inp" style="width:100%;margin:4px 0" value="YUCEL BORU - Aksaray"><label>Adres</label><input id="aAdres" class="inp" style="width:100%;margin:4px 0" value="Aksaray OSB"><label>Iletisim</label><input id="aIlet" class="inp" style="width:100%;margin:4px 0" value="0 532 123 45 67"><label>Banka1</label><input id="aBanka1" class="inp" style="width:100%;margin:4px 0" value="Halkbank TR32 0001 2009 6130 0010 2606 18"><label>Banka2</label><input id="aBanka2" class="inp" style="width:100%;margin:4px 0" value="Is Bankasi TR71 0006 4000 0016 0150 3596 41"><label>Banka3</label><input id="aBanka3" class="inp" style="width:100%;margin:4px 0" value="Akbank TR95 0004 6006 2788 8000 0537 01"><label>V.D./V.N.</label><input id="aVergi" class="inp" style="width:100%;margin:4px 0" value="V.D.: Yuregir - V.N.: 419 006 1367"><label>KDV</label><input id="aKdv" type="number" value="20" class="inp" style="width:100%;margin:4px 0"><label>Iskonto</label><input id="aIsk" type="number" value="0" class="inp" style="width:100%;margin:4px 0"><button class="btn" style="width:100%;background:#ffcc00;color:#111;border:2px solid #012060;padding:10px" onclick="kaydetAyar()">KAYDET</button><button class="btn" style="width:100%;margin-top:6px;background:#ccc" onclick="closeAyar()">KAPAT</button></div></div>
<script>
let URUNLER=[],secListe='YUCEL',sepet=JSON.parse(localStorage.getItem('yucel_sepet_hafif')||'[]');let seciliUrun=null;
let ayar=JSON.parse(localStorage.getItem('yucel_ayar_hafif')||'null')||{firma:"YUCEL BORU - Aksaray",adres:"Aksaray OSB",ilet:"0 532 123 45 67",logo:"",kdv:20,isk:0,banka1:"Halkbank TR32 0001 2009 6130 0010 2606 18",banka2:"Is Bankasi TR71 0006 4000 0016 0150 3596 41",banka3:"Akbank TR95 0004 6006 2788 8000 0537 01",vergi:"V.D.: Yuregir - V.N.: 419 006 1367"};
function safeGet(id){return document.getElementById(id);}
function uygulaAyar(){let a=safeGet('firmaAdiG');if(a)a.innerText=ayar.firma;let b=safeGet('firmaAdresG');if(b)b.innerText=ayar.adres;let l=safeGet('logoImg');if(l&&ayar.logo)l.src=ayar.logo;let gk=safeGet('genelKdv');if(gk)gk.value=ayar.kdv;}
function openAyar(){safeGet('aFirma').value=ayar.firma;safeGet('aAdres').value=ayar.adres;safeGet('aIlet').value=ayar.ilet;safeGet('aKdv').value=ayar.kdv;safeGet('aIsk').value=ayar.isk;safeGet('aBanka1').value=ayar.banka1;safeGet('aBanka2').value=ayar.banka2;safeGet('aBanka3').value=ayar.banka3;safeGet('aVergi').value=ayar.vergi;safeGet('ayarModal').style.display='flex';}
function closeAyar(){safeGet('ayarModal').style.display='none';}
function logoYukle(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=function(){ayar.logo=r.result;safeGet('logoImg').src=r.result;};r.readAsDataURL(f);}
function kaydetAyar(){ayar.firma=safeGet('aFirma').value;ayar.adres=safeGet('aAdres').value;ayar.ilet=safeGet('aIlet').value;ayar.kdv=parseFloat(safeGet('aKdv').value)||20;ayar.isk=parseFloat(safeGet('aIsk').value)||0;ayar.banka1=safeGet('aBanka1').value;ayar.banka2=safeGet('aBanka2').value;ayar.banka3=safeGet('aBanka3').value;ayar.vergi=safeGet('aVergi').value;localStorage.setItem('yucel_ayar_hafif',JSON.stringify(ayar));uygulaAyar();closeAyar();}
function secListeTip(tip){secListe=tip;let y=safeGet('btnYucel'),tos=safeGet('btnTos'),tum=safeGet('btnTumu');y.className='listeBtn';tos.className='listeBtn';tum.className='listeBtn';if(tip==='YUCEL'){y.className='listeBtn active';safeGet('seciliListeTxt').innerText='YUCEL LISTE';}else if(tip==='TOSCELIK'){tos.className='listeBtn activeTos';safeGet('seciliListeTxt').innerText='TOSCELIK LISTE';}else{tum.className='listeBtn active';safeGet('seciliListeTxt').innerText='TUM LISTELER';}filtre();}
async function yukle(){try{let res=await fetch('urun.json?v='+Date.now());let txt=await res.text();let data=JSON.parse(txt);URUNLER=data.map((u,i)=>{u.no=i+1;if(!u.liste)u.liste='YUCEL';return u;});let ls=safeGet('listeSayG');if(ls)ls.innerText=URUNLER.length+' urun | '+(secListe||'TUM')+' | Liste ayri, HTML hafif';filtre();renderSepet();}catch(e){let ls=safeGet('listeSayG');if(ls)ls.innerText='HATA: urun.json bozuk - temiz JSON at! '+e;URUNLER=[];filtre();renderSepet();}}
function filtre(){let q=(safeGet('ara').value||'').toUpperCase().trim();let tbody=safeGet('listeBody');if(!tbody)return;tbody.innerHTML='';let say=0;URUNLER.forEach((u,i)=>{if(secListe && u.liste!==secListe) return;let arama=`${u.ebat} ${u.ebat}x${u.kalinlik}`.toUpperCase();if(q && !arama.includes(q)) return;if(q==='' && say>=80) return; say++;let tr=document.createElement('tr');tr.innerHTML=`<td>${u.no||i+1}</td><td><b>${u.ebat}x${u.kalinlik}</b> = ${u.fiyat} TL <span style="font-size:10px;color:#666"> ${u.tip}</span></td><td><span class="badge ${u.liste==='YUCEL'?'yucel':'tosc'}">${u.liste} LISTE</span></td><td><button class="secBtn" onclick="urunSec(${i})">SEC</button></td>`;tbody.appendChild(tr);});if(tbody.innerHTML===''){tbody.innerHTML=`<tr><td colspan="4" style="text-align:center;color:#999;padding:15px">Urun bulunamadi - ${q} icin ${secListe||'TUM'} listede yok. TUM LISTELER'e bas veya urun.json'u kontrol et. Toplam ${URUNLER.length} urun.</td></tr>`;}}
function urunSec(i){let u=URUNLER[i];seciliUrun=u;let box=safeGet('seciliUrunBox');box.innerHTML=`SECILDI: <b>${u.ebat}x${u.kalinlik} = ${u.fiyat} TL</b> - ${u.liste} LISTE`;box.style.background='#d1fae5';safeGet('kontrols').style.display='grid';safeGet('hesapBar').style.display='flex';safeGet('listeAtBtn').style.display='block';let birim=parseFloat((u.fiyat+'').replace(',','.'))||0;safeGet('altEbat').value=`${u.ebat}x${u.kalinlik} = ${u.fiyat} TL - ${u.liste}`;safeGet('altBf').value=birim.toFixed(2);safeGet('altAdet').value=1;safeGet('altMt').value=6;safeGet('altIsk').value=ayar.isk;safeGet('altKdv').value=ayar.kdv;hesapAlt();window.scrollTo(0,document.body.scrollHeight);}
function hesapAlt(){if(!seciliUrun) return;let adet=parseFloat(safeGet('altAdet').value)||1;let mt=adet*6; safeGet('altMt').value=mt;let bf=parseFloat(safeGet('altBf').value)||0;let isk=parseFloat(safeGet('altIsk').value)||0;let satis=bf*(1-isk/100); safeGet('altSatis').value=satis.toFixed(2);let kdv=parseFloat(safeGet('altKdv').value)||20;let ara=satis*mt; let kdvT=ara*kdv/100; let genel=ara+kdvT;safeGet('hesapBar').innerHTML=`<span>Adet: ${adet} x 6mt = ${mt} mt</span><span>Birim: ${bf.toFixed(2)}</span><span>Isk %${isk} -> ${satis.toFixed(2)}</span><span>Ara: ${ara.toFixed(2)}</span><span>KDV: ${kdvT.toFixed(2)}</span><span style="background:#012060;color:#ffcc00">GENEL: ${genel.toFixed(2)}</span>`;safeGet('listeAtBtn').innerText=`LISTE AT / SEPETE EKLE - ${seciliUrun.ebat}x${seciliUrun.kalinlik} - ${adet} adet = ${mt} mt - GENEL ${genel.toFixed(2)} TL`;}
function listeAt(){if(!seciliUrun){alert('Once urun sec!');return;}let adet=parseFloat(safeGet('altAdet').value)||1;let bf=parseFloat(safeGet('altBf').value)||0;let isk=parseFloat(safeGet('altIsk').value)||0;let satis=bf*(1-isk/100);let mt=adet*6;let kdv=parseFloat(safeGet('altKdv').value)||20;let ara=satis*mt; let kdvT=ara*kdv/100; let genel=ara+kdvT;sepet.push({...seciliUrun,adet,mt,bf,isk,satis,kdv,ara,kdvT,genel});localStorage.setItem('yucel_sepet_hafif',JSON.stringify(sepet));renderSepet();safeGet('seciliUrunBox').innerHTML='EKLENDI - Yeni urun sec';}
function renderSepet(){let sayEl=safeGet('say'); if(sayEl) sayEl.innerText=sepet.length;let genelIsk=parseFloat(safeGet('genelIsk')?.value)||0;let genelKdv=parseFloat(safeGet('genelKdv')?.value)||20;let toplamAra=0,toplamKdv=0,toplamGenel=0;let html='<table><tr><th>No</th><th>Malzeme</th><th>Liste</th><th>Adet/Mt</th><th>Genel</th><th></th></tr>';sepet.forEach((s,i)=>{let satisEff=s.satis*(1-genelIsk/100);let araEff=satisEff*s.mt;let kdvEff=araEff*genelKdv/100;let genelEff=araEff+kdvEff;toplamAra+=araEff;toplamKdv+=kdvEff;toplamGenel+=genelEff;html+=`<tr><td>${i+1}</td><td><b>${s.ebat}x${s.kalinlik}</b> = ${s.fiyat} TL</td><td><span class="badge ${s.liste==='YUCEL'?'yucel':'tosc'}">${s.liste}</span></td><td>${s.adet} adet = ${s.mt} mt</td><td><b>${genelEff.toFixed(2)}</b></td><td><button onclick="sil(${i})" style="color:red;border:none;background:none">X</button></td></tr>`;});html+='</table>';let sl=safeGet('sepetListe'); if(sl) sl.innerHTML=sepet.length?html:'<div style="padding:6px;color:#999">Sepet bos - Once YUCEL LISTE sec, 40x60 yaz, SEC, LISTE AT</div>';let st=safeGet('sepetToplam'); if(st) st.innerText=`ARA:${toplamAra.toFixed(2)} | KDV:${toplamKdv.toFixed(2)} | GENEL:${toplamGenel.toFixed(2)}`;}
function sil(i){sepet.splice(i,1);localStorage.setItem('yucel_sepet_hafif',JSON.stringify(sepet));renderSepet();}
function temizle(){if(confirm('Temizle?')){sepet=[];localStorage.setItem('yucel_sepet_hafif','[]');renderSepet();}}
function yazdir(){if(!sepet.length){alert('Sepet bos');return;}let musteri=safeGet('musteri').value||'';let t=safeGet('mTarih').value||new Date().toLocaleDateString('tr-TR');let genelIsk=parseFloat(safeGet('genelIsk').value)||0;let genelKdv=parseFloat(safeGet('genelKdv').value)||20;let toplamAra=0,toplamKdv=0,toplamGenel=0;let rows=sepet.map((s,i)=>{let satisEff=s.satis*(1-genelIsk/100);let araEff=satisEff*s.mt;let kdvEff=araEff*genelKdv/100;let genelEff=araEff+kdvEff;toplamAra+=araEff;toplamKdv+=kdvEff;toplamGenel+=genelEff;return `<tr><td>${i+1}</td><td>${s.ebat}x${s.kalinlik} = ${s.fiyat} TL</td><td>${s.tip}</td><td>${s.liste} LISTE</td><td>${s.adet} adet (${s.mt} mt)</td><td>${s.bf.toFixed(2)} TL</td><td>%${s.isk} ${genelIsk?'+%'+genelIsk:''}</td><td>${satisEff.toFixed(2)} TL</td><td>${araEff.toFixed(2)} TL</td><td>${genelEff.toFixed(2)} TL</td></tr>`;}).join('');let html=`<!DOCTYPE html><html><head><meta charset="UTF-8"><style>body{font-family:Arial;font-size:11px} .head{display:flex;justify-content:space-between;border-bottom:4px solid #012060;padding-bottom:8px} .logo{width:70px;height:70px;border:1px solid #ccc} table{width:100%;border-collapse:collapse;margin-top:8px} th{background:#012060;color:white;padding:5px;font-size:10px} td{padding:5px;border-bottom:1px solid #ddd} .toplam{background:#012060;color:white;padding:10px;display:flex;justify-content:space-between;font-weight:900} .bank{border:2px solid #111;padding:6px;background:#fffde7;margin-top:8px;font-size:10px} .kaseAlani{display:flex;justify-content:space-between;margin-top:15px;gap:10px} .kase{border:2px dashed #333;width:30%;height:110px;display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center;font-size:10px}</style></head><body><div class="head"><div><img class="logo" src="${ayar.logo||'https://via.placeholder.com/80?text=LOGO'}"><h2>${ayar.firma}</h2><div>${ayar.adres}</div><div>${ayar.ilet}</div><div>${ayar.vergi}</div><div>Tarih:${t} | Musteri:${musteri}</div></div><div style="text-align:right"><b>DOVIZ</b><br>USD:${safeGet('usd').innerText} TL<br>EUR:${safeGet('eur').innerText} TL<br><br>Liste:25.09.2026<br>Kalem:${sepet.length}</div></div><table><tr><th>No</th><th>Malzeme Cinsi</th><th>Tip</th><th>Liste</th><th>Adet/Mt</th><th>Birim</th><th>Isk</th><th>Satis</th><th>Tutar</th><th>Genel</th></tr>${rows}</table><div class="toplam"><span>ARA:${toplamAra.toFixed(2)} | KDV %${genelKdv}:${toplamKdv.toFixed(2)}</span><span>GENEL:${toplamGenel.toFixed(2)} TL</span></div><div class="bank"><b>HESAP NUMARALARIMIZ:</b><br>1-${ayar.banka1}<br>2-${ayar.banka2}<br>3-${ayar.banka3}<br>${ayar.vergi}</div><div class="kaseAlani"><div class="kase"><b>SATIS YONETICISI</b><br><br>${ayar.firma}<br><br>(KASE-IMZA)</div><div class="kase"><b>SATIS TEMSILCISI</b><br><br>(KASE-IMZA)</div><div class="kase"><b>MUSTERI ONAYI</b><br><br>(KASE-IMZA)</div></div><div style="text-align:center;margin-top:12px"><button onclick="window.print()" style="padding:10px 20px;background:#012060;color:white;border:none;border-radius:6px;font-weight:900">YAZDIR / PDF</button></div></body></html>`;let w=window.open('','_blank');w.document.write(html);w.document.close();}
let mt=safeGet('mTarih'); if(mt) mt.valueAsDate=new Date(); uygulaAyar(); yukle();
</script>
</body>
</html>
